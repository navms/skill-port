<svg xmlns="http://www.w3.org/2000/svg" width="900" height="368" viewBox="0 0 900 368"
     role="img" aria-label="How SkillPort works: import, reconcile, plan, apply — and never overwrite a conflict">
  <title>SkillPort 的工作方式：导入 → 核对 → 计划 → 应用</title>
  <defs>
    <style>
      .sans { font-family: 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }
      .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="368" rx="16" fill="#121211" />
  <rect x="0.5" y="0.5" width="899" height="367" rx="15.5" fill="none"
        stroke="rgba(255,255,255,0.07)" />

  <text class="mono" x="32" y="40" font-size="11" letter-spacing="2" fill="#ff5a2a">HOW IT WORKS</text>
  <text class="mono" x="868" y="40" text-anchor="end" font-size="11" letter-spacing="0.6"
        fill="#8a887f">只读核对 · 计划先行 · 覆盖前备份</text>

  <g class="sans">
    <!-- 01 -->
    <rect x="32" y="60" width="196" height="156" rx="12" fill="#171716"
          stroke="rgba(255,255,255,0.08)" />
    <text class="mono" x="48" y="88" font-size="12" letter-spacing="0.8" fill="#ff5a2a">01</text>
    <text x="48" y="122" font-size="17" font-weight="600" fill="#f0eee8">导入</text>
    <text x="48" y="150" font-size="13.5" fill="#928f86">校验 SKILL.md 与</text>
    <text x="48" y="168" font-size="13.5" fill="#928f86">frontmatter，缺字段</text>
    <text x="48" y="186" font-size="13.5" fill="#928f86">就拒绝，不写库。</text>

    <!-- 02 -->
    <rect x="245" y="60" width="196" height="156" rx="12" fill="#171716"
          stroke="rgba(255,255,255,0.08)" />
    <text class="mono" x="261" y="88" font-size="12" letter-spacing="0.8" fill="#ff5a2a">02</text>
    <text x="261" y="122" font-size="17" font-weight="600" fill="#f0eee8">核对</text>
    <text x="261" y="150" font-size="13.5" fill="#928f86">扫描库与每个目标，</text>
    <text x="261" y="168" font-size="13.5" fill="#928f86">写回实测状态。</text>
    <text x="261" y="186" font-size="13.5" fill="#928f86">只读，不改文件。</text>

    <!-- 03 -->
    <rect x="458" y="60" width="196" height="156" rx="12" fill="#171716"
          stroke="rgba(255,255,255,0.08)" />
    <text class="mono" x="474" y="88" font-size="12" letter-spacing="0.8" fill="#ff5a2a">03</text>
    <text x="474" y="122" font-size="17" font-weight="600" fill="#f0eee8">计划</text>
    <text x="474" y="150" font-size="13.5" fill="#928f86">列出 create / repair /</text>
    <text x="474" y="168" font-size="13.5" fill="#928f86">skip / conflict。</text>
    <text x="474" y="186" font-size="13.5" fill="#928f86">5 分钟内有效。</text>

    <!-- 04 -->
    <rect x="671" y="60" width="196" height="156" rx="12" fill="#171716"
          stroke="rgba(255,255,255,0.08)" />
    <text class="mono" x="687" y="88" font-size="12" letter-spacing="0.8" fill="#ff5a2a">04</text>
    <text x="687" y="122" font-size="17" font-weight="600" fill="#f0eee8">应用</text>
    <text x="687" y="150" font-size="13.5" fill="#928f86">建链接或拷贝，</text>
    <text x="687" y="168" font-size="13.5" fill="#928f86">覆盖前先备份。</text>
    <text x="687" y="186" font-size="13.5" fill="#928f86">结果幂等、可撤销。</text>
  </g>

  <!-- connectors -->
  <g stroke="#4a4944" stroke-width="1.2" fill="none" stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M231 138h8M235 134l4 4-4 4" />
    <path d="M444 138h8M448 134l4 4-4 4" />
    <path d="M657 138h8M661 134l4 4-4 4" />
  </g>

  <!-- conflict rule -->
  <rect x="32" y="236" width="835" height="100" rx="12" fill="rgba(240,106,94,0.05)"
        stroke="rgba(240,106,94,0.18)" />
  <rect x="32" y="236" width="3" height="100" rx="1.5" fill="#f06a5e" />
  <circle cx="59" cy="267" r="3.4" fill="#f06a5e" />
  <text class="sans" x="72" y="272" font-size="16" font-weight="600" fill="#f0eee8">冲突不静默处理</text>
  <text class="sans" x="59" y="297" font-size="13.5" fill="#928f86">目标目录里已经有 SkillPort 不拥有的同名目录时，标为「冲突」并交给你决定：接管、保留并忽略，或取消安装。</text>
  <text class="sans" x="59" y="317" font-size="13.5" fill="#928f86">工具绝不自动覆盖或删除——你自己放进去的内容，永远不会被本工具删除。</text>
</svg>
