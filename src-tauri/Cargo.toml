[package]
name = "skillport"
version = "0.1.0"
description = "SkillPort — Agent Skill manager"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "skillport_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
blake3 = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
ulid = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
