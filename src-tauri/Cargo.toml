[package]
name = "skillport"
version = "0.2.0"
description = "SkillPort — Agent Skill manager"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "skillport_lib"
crate-type = ["rlib"]

[workspace]
members = ["crates/skillport-core", "crates/skillport-cli"]
resolver = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skillport-core = { path = "crates/skillport-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
serde_yaml_ng = "0.10"
tempfile = "3"
