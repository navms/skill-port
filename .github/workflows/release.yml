name: Release

# 打 `v*` tag 时构建并上传安装包。tag 必须与 `src-tauri/tauri.conf.json` 的 version 一致。
# 需要的仓库 secrets（Settings → Secrets and variables → Actions）：
#   macOS 签名 / 公证：
#     APPLE_CERTIFICATE             Developer ID Application 证书（.p12，base64）
#     APPLE_CERTIFICATE_PASSWORD    证书密码
#     APPLE_SIGNING_IDENTITY        如 "Developer ID Application: Name (TEAMID)"
#     APPLE_ID                      Apple ID
#     APPLE_PASSWORD                App 专用密码
#     APPLE_TEAM_ID                 Team ID
#     KEYCHAIN_PASSWORD             临时 keychain 密码（任意随机值）
#   没有配置这些 secrets 时会产出未签名的构建，macOS 首次打开需右键 → 打开。
#   Windows 代码签名尚未接入（需要证书与 signtool / Azure Trusted Signing 配置）；
#   未签名的安装包会触发 SmartScreen 提示。

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    env:
      # 只有真的配了证书才导出签名变量；空字符串会让 Tauri 尝试导入一个空的 p12 并失败。
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check tag matches app version
        shell: bash
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: Configure macOS signing
        if: matrix.platform == 'macos-latest' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          {
            printf 'APPLE_CERTIFICATE=%s\n' "$APPLE_CERTIFICATE"
            printf 'APPLE_CERTIFICATE_PASSWORD=%s\n' "$APPLE_CERTIFICATE_PASSWORD"
            printf 'APPLE_SIGNING_IDENTITY=%s\n' "$APPLE_SIGNING_IDENTITY"
            printf 'APPLE_ID=%s\n' "$APPLE_ID"
            printf 'APPLE_PASSWORD=%s\n' "$APPLE_PASSWORD"
            printf 'APPLE_TEAM_ID=%s\n' "$APPLE_TEAM_ID"
            printf 'KEYCHAIN_PASSWORD=%s\n' "$KEYCHAIN_PASSWORD"
          } >> "$GITHUB_ENV"

      # CLI 与桌面端共用 skillport-core；先按各架构构建，macOS 再 lipo 成 Universal。
      - name: Build CLI (macOS universal)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p skillport-cli --manifest-path src-tauri/Cargo.toml \
            --target aarch64-apple-darwin
          cargo build --release -p skillport-cli --manifest-path src-tauri/Cargo.toml \
            --target x86_64-apple-darwin
          mkdir -p dist-cli
          lipo -create \
            src-tauri/target/aarch64-apple-darwin/release/skillport-cli \
            src-tauri/target/x86_64-apple-darwin/release/skillport-cli \
            -output dist-cli/skillport-cli
          # lipo 会破坏签名；arm64 至少需要 ad-hoc 签名才能执行。
          identity="${APPLE_SIGNING_IDENTITY:-}"
          if [ -n "$identity" ] && security find-identity -v -p codesigning | grep -qF "$identity"; then
            codesign --force --options runtime --timestamp --sign "$identity" dist-cli/skillport-cli
          else
            codesign --force --sign - dist-cli/skillport-cli
          fi
          tar -czf "skillport-cli-${GITHUB_REF_NAME}-macos-universal.tar.gz" -C dist-cli skillport-cli

      - name: Build CLI (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          cargo build --release -p skillport-cli --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml
          New-Item -ItemType Directory -Force -Path dist-cli | Out-Null
          Copy-Item "src-tauri\target\x86_64-pc-windows-msvc\release\skillport-cli.exe" "dist-cli\skillport-cli.exe"
          Compress-Archive -Path "dist-cli\skillport-cli.exe" -DestinationPath "skillport-cli-$($env:GITHUB_REF_NAME)-windows-x86_64.zip" -Force

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SkillPort ${{ github.ref_name }}
          releaseBody: |
            - macOS：`.dmg`（Universal，包含 Intel 与 Apple Silicon）
            - Windows：`.msi` 与 NSIS `.exe`
            - 命令行（其他 agent 用）：
              - macOS：`skillport-cli-<tag>-macos-universal.tar.gz`
              - Windows：`skillport-cli-<tag>-windows-x86_64.zip`

            安装包由 CI 自动构建；发布前请确认签名与公证状态。
            CLI 是独立二进制：macOS 上未公证（首次运行可能需在「隐私与安全性」中允许），Windows 上未签名。
          # 先出草稿，确认产物后再手动 Publish。想全自动发布改成 false。
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      # tauri-action 已创建（或更新）草稿 Release，这里把 CLI 产物挂到同一个 tag 下。
      - name: Upload CLI to release (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          "skillport-cli-${GITHUB_REF_NAME}-macos-universal.tar.gz"
          --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload CLI to release (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "$($env:GITHUB_REF_NAME)"
          "skillport-cli-$($env:GITHUB_REF_NAME)-windows-x86_64.zip"
          --clobber --repo "$($env:GITHUB_REPOSITORY)"
